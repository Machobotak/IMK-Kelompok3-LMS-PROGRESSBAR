<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS UMM - Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-login">
  <div class="login-container">
    <div class="login-box">
      <h2>Polysynchronous Learning Design</h2>
      <p>Login menggunakan akun Anda:</p>
      <form id="loginForm">
        <label for="username" style="display:block; text-align:left; font-size:12px; margin-bottom:5px;">NIM</label>
        <input type="text" id="username" value="202410370110123" readonly>
        <label for="password" style="display:block; text-align:left; font-size:12px; margin-bottom:5px;">PIC</label>
        <input type="password" id="password" value="123456" readonly>
        <button type="submit">Masuk</button>
      </form>
    </div>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nim = document.getElementById('username').value;
      const pic = document.getElementById('password').value;
      if (nim === "202410370110123" && pic === "123456") {
        localStorage.setItem("nim", nim);
        window.location.href = "dashboard.html";
      } else { alert("NIM atau PIC salah!"); }
    });
  </script>
</body>
</html>
