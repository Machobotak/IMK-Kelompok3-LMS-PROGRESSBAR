<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitur Belum Tersedia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#f4f6f9;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
}

.box{
    background:white;
    padding:40px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    max-width:400px;
}

.box h1{
    color:#8B0000;
    margin-bottom:15px;
}

.box p{
    font-size:14px;
    color:#555;
    margin-bottom:25px;
}

.box button{
    background:#8B0000;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
}
.box button:hover{
    background:#a00000;
}
</style>
</head>

<body>

<div class="box">
    <h1>🚧 Fitur Belum Tersedia</h1>
    <p>
        Mohon maaf, fitur ini masih dalam tahap pengembangan.<br>
        Silakan kembali ke dashboard.
    </p>
    <button onclick="window.history.back()">⬅ Kembali</button>
</div>

</body>
</html>
