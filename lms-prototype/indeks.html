<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS UMM Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="login-box">
      <h2>Polysynchronous Learning Design</h2>
      <p>Login menggunakan akun Anda:</p>

      <form id="loginForm">
        <label for="username">NIM</label>
        <input type="text" id="username" value="202410370110123" readonly>

        <label for="password">PIC</label>
        <input type="password" id="password" value="123456" readonly>

        <button type="submit">Masuk</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const nim = document.getElementById('username').value;
      const pic = document.getElementById('password').value;
      alert(`Login Berhasil!\nNIM: ${nim}\nPIC: ${pic}`);
    });
  </script>
</body>
</html>
